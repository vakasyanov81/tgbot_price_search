[flake8]
# Базовая настройка flake8 как в priceformation:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 120
max-imports = 18
max-arguments = 6
max-attributes = 8

# Только wemake-python-styleguide и системные проверки:
select = WPS, E99

exclude =
    .git,
    .venv,
    .mypy_cache,
    .ruff_cache,
    .pytest_cache,
    htmlcov,
    priceformation,
    build,
    dist,

# Намеренные шаблоны проекта (как в priceformation):
# WPS300 — относительные импорты внутри пакета
# WPS301 — точечный импорт (from x import y as z)
# WPS407 — модульные таблицы и реестры (команды, источники прайсов)
# WPS430 — декораторы и небольшие вложенные помощники
# WPS615 — публичный get_* API (загрузчик прайса)
ignore =
    WPS300,
    WPS301,
    WPS407,
    WPS430,
    WPS615

per-file-ignores =
    # Реэкспорт обработчиков в __init__ пакета.
    **/__init__.py: WPS412, WPS410, WPS411
    # Тесты: литералы фикстур, заглушки (как в priceformation).
    tests/**/*.py: WPS111, WPS118, WPS201, WPS202, WPS204, WPS210, WPS211, WPS218, WPS226, WPS229, WPS231, WPS235, WPS336, WPS339, WPS342, WPS358, WPS402, WPS420, WPS432, WPS441, WPS442, WPS459, WPS501, WPS604
    tests/*.py: WPS111, WPS118, WPS201, WPS202, WPS204, WPS210, WPS211, WPS218, WPS226, WPS229, WPS231, WPS235, WPS336, WPS339, WPS342, WPS358, WPS402, WPS420, WPS432, WPS441, WPS442, WPS459, WPS501, WPS604
