name: Lint and check types

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install project dependency
      run: |
          uv sync --locked --all-extras --dev

    - name: Check code formatting by black
      run: |
        uv run black ${GITHUB_WORKSPACE} --check --line-length 120 --skip-string-normalization --target-version py311

    - name: Lint code by ruff
      run: |
        uv run ruff check

    - name: Check types by pyright
      run: |
        uv run pyright